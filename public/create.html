<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>考试系统 - AI 组卷</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav class="topnav no-print">
  <a class="brand" href="/">考试系统</a>
  <a href="/">首页</a>
  <a href="/bank.html">题库</a>
  <a href="/create.html" class="active">AI 组卷</a>
  <a href="/history.html">考试历史</a>
  <a href="/wrong.html">错题本</a>
</nav>
<div class="container narrow">
  <h1 class="page-title">AI 智能组卷</h1>
  <p class="page-sub">AI 将参考题库中该科目的题目风格与知识点命制全新试题（不照搬原题），并自动入库</p>

  <div class="card">
    <div class="form-row">
      <div class="field" style="max-width:170px;"><label>科目 *</label>
        <input type="text" id="subject" list="subjectList" value="数学" placeholder="如：数学">
        <datalist id="subjectList"></datalist>
      </div>
      <div class="field"><label>试卷标题</label>
        <input type="text" id="title" placeholder="留空自动命名">
      </div>
      <div class="field" style="max-width:140px;"><label>时长（分钟）</label>
        <input type="number" id="duration" min="1" placeholder="不限时">
      </div>
    </div>

    <div class="field"><label>题型分布（留空则创建空白试卷，供外部 agent 逐题添加）</label>
      <div id="distRows"></div>
      <button class="btn sm ghost" onclick="addDistRow()">+ 添加题型</button>
    </div>

    <div style="display:flex;align-items:center;gap:16px;margin-top:6px;">
      <div>卷面总分：<b id="totalPreview" style="color:#2b6cb0;font-size:18px;">0</b> 分</div>
      <div style="flex:1;"></div>
      <button class="btn primary" id="genBtn" onclick="generate()" style="min-width:180px;">开始生成</button>
    </div>
  </div>

  <div class="card" id="result" style="display:none;">
    <h2 style="font-size:17px;margin:0 0 10px;">生成成功</h2>
    <div id="resultBody"></div>
  </div>
</div>

<script src="/js/api.js"></script>
<script>
document.getElementById('subjectList').innerHTML = SUBJECTS.map(s => `<option>${s}</option>`).join('');

function addDistRow(type = 'single', count = 5, scoreEach = 3) {
  const div = document.createElement('div');
  div.style.cssText = 'display:flex;gap:10px;margin-bottom:8px;align-items:center;';
  div.innerHTML = `
    <select class="dType">${Object.entries(TYPE_LABEL).map(([k, v]) => `<option value="${k}" ${k === type ? 'selected' : ''}>${v}</option>`).join('')}</select>
    <input type="number" class="dCount" min="1" max="60" value="${count}" style="width:90px;" title="数量">
    <span style="color:#889;">道 × 每题</span>
    <input type="number" class="dScore" min="0.5" step="0.5" value="${scoreEach}" style="width:90px;" title="每题分值">
    <span style="color:#889;">分</span>
    <button class="btn sm ghost" onclick="this.parentNode.remove();calcTotal()">删除</button>`;
  div.querySelector('.dCount').addEventListener('input', calcTotal);
  div.querySelector('.dScore').addEventListener('input', calcTotal);
  document.getElementById('distRows').appendChild(div);
  calcTotal();
}

function calcTotal() {
  let t = 0;
  document.querySelectorAll('#distRows > div').forEach(r => {
    t += (Number(r.querySelector('.dCount').value) || 0) * (Number(r.querySelector('.dScore').value) || 0);
  });
  document.getElementById('totalPreview').textContent = t;
}

function gatherDistribution() {
  return [...document.querySelectorAll('#distRows > div')].map(r => ({
    type: r.querySelector('.dType').value,
    count: Number(r.querySelector('.dCount').value) || 0,
    scoreEach: Number(r.querySelector('.dScore').value) || 5
  })).filter(d => d.count > 0);
}

async function generate() {
  const subject = document.getElementById('subject').value.trim();
  if (!subject) return toast('请填写科目', true);
  const btn = document.getElementById('genBtn');
  btn.disabled = true;
  btn.textContent = 'AI 出题中，约需 1-2 分钟…';
  try {
    const r = await api('/papers/generate', {
      method: 'POST',
      body: {
        subject,
        title: document.getElementById('title').value.trim() || undefined,
        durationMinutes: Number(document.getElementById('duration').value) || undefined,
        distribution: gatherDistribution()
      }
    });
    const card = document.getElementById('result');
    card.style.display = 'block';
    card.scrollIntoView({ behavior: 'smooth' });
    document.getElementById('resultBody').innerHTML = `
      <p>试卷 ID：<code>${r.paperId}</code>　共 ${r.questionCount} 题、${r.totalScore} 分</p>
      <p>答题地址：<a href="${r.url}" target="_blank">${r.url}</a></p>
      ${r.warnings ? `<p style="color:#b26205;font-size:13px;">提示：${r.warnings.map(esc).join('；')}</p>` : ''}
      <div style="margin-top:10px;">
        <a class="btn primary" href="/exam/${r.paperId}">去答题</a>
        <button class="btn ghost" onclick="copyText('${r.url}')">复制地址</button>
      </div>`;
  } catch (e) {
    toast(e.message, true);
  } finally {
    btn.disabled = false;
    btn.textContent = '开始生成';
  }
}

async function copyText(t) {
  try { await navigator.clipboard.writeText(t); toast('已复制'); } catch (_) { toast(t); }
}

addDistRow('single', 5, 3);
addDistRow('fill', 3, 4);
addDistRow('qa', 2, 10);
calcTotal();
</script>
</body>
</html>
