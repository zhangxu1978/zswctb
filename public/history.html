<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>考试系统 - 考试历史</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav class="topnav no-print">
  <a class="brand" href="/">考试系统</a>
  <a href="/">首页</a>
  <a href="/bank.html">题库</a>
  <a href="/create.html">AI 组卷</a>
  <a href="/history.html" class="active">考试历史</a>
  <a href="/wrong.html">错题本</a>
</nav>
<div class="container">
  <h1 class="page-title">考试历史</h1>
  <p class="page-sub">所有答题记录，同一试卷可多次考试，点击查看对应成绩</p>
  <div class="card">
    <table class="table">
      <thead><tr><th>提交时间</th><th>试卷</th><th>次数</th><th>科目</th><th>姓名</th><th>状态</th><th>得分</th><th>用时</th><th>操作</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty-tip" id="emptyTip" style="display:none;">还没有考试记录</div>
  </div>
</div>
<script src="/js/api.js"></script>
<script>
async function load() {
  const list = await api('/history');
  document.getElementById('emptyTip').style.display = list.length ? 'none' : 'block';
  document.getElementById('rows').innerHTML = list.map(e => `<tr>
    <td style="color:#889;font-size:13px;">${esc(e.submitted_at || e.started_at || '')}</td>
    <td><a href="/exam/${e.paper_id}">${esc(e.paper_title)}</a></td>
    <td>第 ${e.attempt} 次</td>
    <td>${esc(e.subject || '-')}</td>
    <td>${esc(e.student_name)}</td>
    <td>${examStatusBadge(e.status, e.examStatusZh)}</td>
    <td>${e.total_score != null ? `<b>${e.total_score}</b> / ${e.paper_total}` : '—'}</td>
    <td>${fmtDuration(e.total_time)}</td>
    <td>${e.status === 'ongoing'
      ? `<a class="btn sm" href="/exam/${e.paper_id}">继续考试</a>`
      : `<a class="btn sm ghost" href="/result/${e.id}">查看结果</a>`}</td>
  </tr>`).join('');
}
load().catch(e => toast(e.message, true));
</script>
</body>
</html>
